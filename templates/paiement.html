<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Paiement</title>
        <!-- On charge le général et le spécifique -->
        <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='paiement.css') }}">
    </head>
    <body>
        <!-- Barre de navigation (main.css) -->
        <nav class="navbar">
            <div class="container nav-content">
                <a href="/" class="btn btn-nav">
                    <span>🏠</span><span class="font-medium">Page d'accueil</span>
                </a>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <a href="/panier" class="btn btn-nav"><span>🛒</span> Panier</a>
                    <div class="group">
                        <button class="btn btn-nav"><span>👤</span></button>
                        <div class="dropdown-menu">
                            {% if not session.get('user_email') %}
                                <a href="/login" class="dropdown-item">🔑 Se connecter</a>
                                <a href="/register" class="dropdown-item">📝 S'inscrire</a>
                            {% else %}
                                <a href="/profil" class="dropdown-item">👤 Mon Compte</a>
                                <div style="border-top: 1px solid #eee; margin: 0.5rem 0;"></div>
                                <a href="/logout" class="dropdown-item" style="color: var(--destructive);">🚪 Déconnexion</a>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Contenu de la Page (Modal) -->
        <div id="payment-modal" class="modal-overlay">
            
            <div class="payment-card">
                <!-- Header -->
                <div class="payment-header">
                    <h2 style="margin: 0; font-size: 1.5rem;">Paiement sécurisé</h2>
                    <button onclick="closeModal()" class="close-btn">✕</button>
                </div>

                <!-- Formulaire -->
                <form action="/paiement" method="POST" class="payment-body">
                    <!-- Numéro de carte -->
                    <div class="form-group">
                        <label class="label">Numéro de carte</label>
                        <input type="text" name="card_number" placeholder="1234 5678 9012 3456" class="input" required>
                    </div>

                    <!-- Grille Expiration + CVV -->
                    <div class="input-grid">
                        <div>
                            <label class="label">Expiration</label>
                            <input type="text" name="expiry" placeholder="MM/AA" class="input" required>
                        </div>
                        <div>
                            <label class="label">CVV</label>
                            <input type="text" name="cvv" placeholder="123" class="input" required>
                        </div>
                    </div>

                    <!-- Note de sécurité -->
                    <div class="security-note">
                        <span>🔒</span>
                        <span>Vos informations sont cryptées.</span>
                    </div>

                    <!-- Bouton -->
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 1rem;">
                        Confirmer le paiement
                    </button>
                </form>
            </div>
        </div>

        <script>
            function closeModal() {
                document.getElementById('payment-modal').style.display = 'none';
            }
        </script>
    </body>
</html>
