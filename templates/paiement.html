<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Paiement</title>
        <!-- On charge le général et le spécifique -->
        <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='paiement.css') }}">
    </head>
    <body>
        <!-- Barre de navigation (main.css) -->
        <nav class="navbar">
            <div class="container nav-content">
                <a href="/" class="btn btn-nav">🏠 Accueil</a>
                <div style="display: flex; gap: 1rem;">
                    {% if session.get('user_id') %}
                    <a href="/panier" class="btn btn-nav">🛒 Panier</a>
                    {% endif %}
                    <div class="group">
                        <button class="btn btn-nav"><span>👤</span></button>
                        <div class="dropdown-menu">
                        {% if session.get('user_id') %}
                            <a href="/profil" class="dropdown-item">👤 Profil</a>
                            <a href="/logout" class="dropdown-item">🚪 Déconnexion</a>
                        {% else %}
                            <a href="/login" class="dropdown-item">👤 Connexion</a>
                            <a href="/register" class="dropdown-item">📝 Inscription</a>
                        {% endif %}
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Contenu de la Page (Modal) -->
        <div id="payment-modal" class="modal-overlay">
            
            <div class="payment-card">
                <!-- Header -->
                <div class="payment-header">
                    <h2 style="margin: 0; font-size: 1.5rem;">Paiement sécurisé</h2>
                    <a href="/panier" class="close-btn">✕</a>
                </div>

                <!-- Formulaire -->
                <form action="/paiement" method="POST" class="payment-body">
                    <!-- Numéro de carte -->
                    <div class="form-group">
                        <label class="label">Numéro de carte</label>
                        <input type="text" name="card_number" autocomplete="off" placeholder="1234 5678 9012 3456" class="input" required>
                    </div>

                    <!-- Grille Expiration + CVV -->
                    <div class="input-grid">
                        <div>
                            <label class="label">Expiration</label>
                            <input type="text" name="expiry" autocomplete="off" placeholder="MM/AA" class="input" required>
                        </div>
                        <div>
                            <label class="label">CVV</label>
                            <input type="text" name="cvv" autocomplete="off" placeholder="123" class="input" required>
                        </div>
                    </div>

                    <!-- Bouton -->
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 1rem;">
                        Confirmer le paiement
                    </button>
                </form>
            </div>
        </div>
    </body>
</html>
